[project]
name = "rendvest-back"
version = "0.1.0"
description = "API de finanças pessoais com Django REST Framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7,<5",
    "django-environ>=0.12,<0.13",
    "django-filter>=25.1,<26",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt[crypto]>=5.5,<6",
    "drf-spectacular>=0.28,<0.29",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
